<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dự đoán giá nhà - HomeVal</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<site-header active="predict"></site-header>
<main class="container page" style="max-width:720px">
  <h1>Dự đoán giá nhà</h1>
  <p class="field__hint">Nhập thông tin căn nhà để nhận mức giá ước tính theo model đang hoạt động.</p>
  <form id="prediction-form" class="stack" novalidate>
    <div class="prediction-form__grid">
      <div class="field">
        <label class="field__label" for="district">Quận/huyện</label>
        <select class="select" id="district" name="district" required>
          <option value="">Chọn quận/huyện</option>
          <option value="Thủ Đức">Thủ Đức</option>
          <option value="Bình Thạnh">Bình Thạnh</option>
          <option value="Quận 7">Quận 7</option>
          <option value="Quận 1">Quận 1</option>
        </select>
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="property_type">Loại hình</label>
        <select class="select" id="property_type" name="property_type" required>
          <option value="">Chọn loại hình</option>
          <option>Nhà phố</option>
          <option>Căn hộ</option>
          <option>Biệt thự</option>
        </select>
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="area_m2">Diện tích (m²)</label>
        <input class="input" id="area_m2" name="area_m2" type="number" min="15" max="1000" required value="72">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="bedrooms">Phòng ngủ</label>
        <input class="input" id="bedrooms" name="bedrooms" type="number" min="0" max="15" required value="3">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="bathrooms">Phòng tắm</label>
        <input class="input" id="bathrooms" name="bathrooms" type="number" min="0" max="15" required value="2">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="floors">Số tầng</label>
        <input class="input" id="floors" name="floors" type="number" min="1" max="20" required value="2">
        <p class="field__error"></p>
      </div>
    </div>
    <button class="btn btn--primary" type="submit">Xem giá ước tính</button>
  </form>
</main>
<site-footer></site-footer>
<script type="module" src="js/components/site-header.js"></script>
<script type="module" src="js/components/site-footer.js"></script>
<script type="module" src="js/pages/predict.js"></script>
</body>
</html>
