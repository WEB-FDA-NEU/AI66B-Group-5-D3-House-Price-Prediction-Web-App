<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ của tôi - HomeVal</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/design.css">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/experience.css">
<link rel="stylesheet" href="css/ux.css"><link rel="stylesheet" href="css/luxe.css"></head>
<body>

<site-header active="profile"></site-header>

<main class="container page stack profile-page">
  <div class="page-heading"><p class="eyebrow">KHÔNG GIAN CỦA BẠN</p><h1>Hồ sơ của tôi</h1><p>Quản lý thông tin cá nhân và bảo mật tài khoản.</p></div>
  <section class="panel profile-stats" aria-live="polite">
    <h2>Thống kê tài khoản</h2>
    <p><strong id="saved-prediction-count">—</strong> dự đoán đã lưu</p>
    <p class="field__hint">Thành viên từ <time id="member-since">đang tải…</time></p>
  </section>
  <div class="profile-columns">

  <!-- ══════════════ Sửa thông tin ══════════════ -->
  <section class="panel stack">
    <h2>Thông tin cá nhân</h2>
    <form id="profile-form" class="stack" novalidate>
      <div class="field">
        <label class="field__label" for="display_name">Tên hiển thị</label>
        <input class="input" id="display_name" name="display_name" required>
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required autocomplete="email">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="phone">Số điện thoại</label>
        <input class="input" id="phone" name="phone" type="tel" maxlength="20" autocomplete="tel">
        <p class="field__error"></p>
      </div>
      <button class="btn btn--primary" type="submit">Lưu thay đổi</button>
    </form>
  </section>

  <!-- ══════════════ Đổi mật khẩu ══════════════ -->
  <section class="panel stack">
    <h2>Đổi mật khẩu</h2>
    <form id="password-form" class="stack" novalidate>
      <div class="field">
        <label class="field__label" for="current_password">Mật khẩu hiện tại</label>
        <input class="input" id="current_password" name="current_password" type="password" required autocomplete="current-password">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="new_password">Mật khẩu mới</label>
        <input class="input" id="new_password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="confirm_password">Nhập lại mật khẩu mới</label>
        <input class="input" id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
        <p class="field__error"></p>
      </div>
      <button class="btn btn--primary" type="submit">Đổi mật khẩu</button>
    </form>
  </section>
  <section class="panel stack" id="delete-account-panel">
    <h2>Xóa tài khoản</h2>
    <p class="field__hint">Thao tác này xóa tài khoản, dự đoán đã lưu và dữ liệu liên quan. Không thể hoàn tác.</p>
    <form id="delete-account-form" class="stack" novalidate>
      <div class="field">
        <label class="field__label" for="delete-confirmation">Nhập DELETE để xác nhận</label>
        <input class="input" id="delete-confirmation" name="confirmation" autocomplete="off" required>
        <p class="field__error"></p>
      </div>
      <button class="btn btn--danger" type="submit">Xóa tài khoản và dữ liệu</button>
    </form>
  </section>
</div></main>

<site-footer></site-footer>
<dialog id="confirm-dialog">
  <h2 class="dialog__title"></h2>
  <p class="dialog__message"></p>
  <div class="dialog__actions">
    <button class="btn" data-cancel>Hủy</button>
    <button class="btn btn--danger" data-confirm>Xóa</button>
  </div>
</dialog>

<script type="module" src="js/pages/profile.js"></script>
</body>
</html>
