<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch sử dự đoán - HomeVal</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/design.css">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/experience.css">
<link rel="stylesheet" href="css/ux.css">
<link rel="stylesheet" href="css/compare.css"><link rel="stylesheet" href="css/luxe.css"></head>
<body>
<site-header active="predictions"></site-header>
<main class="container page stack">
  <div class="history-heading">
    <div>
      <p class="eyebrow">KHÔNG GIAN CỦA BẠN</p><h1>Dự đoán đã lưu</h1>
      <p class="field__hint">Mỗi ngôi nhà bạn quan tâm, được lưu lại ở một nơi.</p>
    </div>
    <div class="row__actions">
      <button class="btn" id="export-history" type="button">Xuất CSV</button>
      <a class="btn btn--primary" href="predict.html">Dự đoán mới</a>
    </div>
  </div>
  <form id="history-search" class="history-search" role="search">
    <div class="field"><label class="field__label" for="history-q">Tìm kiếm</label><input class="input" id="history-q" name="q" placeholder="Nhãn, quận/huyện hoặc loại hình"></div>
    <div class="field"><label class="field__label" for="history-property-type">Loại hình</label><select class="select" id="history-property-type" name="property_type"><option value="">Tất cả</option><option>Nhà phố</option><option>Căn hộ</option><option>Biệt thự</option></select></div>
    <div class="field"><label class="field__label" for="history-district">Quận/huyện</label><input class="input" id="history-district" name="district" placeholder="Tất cả khu vực"></div>
    <div class="field"><label class="field__label" for="history-min-price">Giá từ (VND)</label><input class="input" id="history-min-price" name="min_price" type="number" min="0" inputmode="numeric"></div>
    <div class="field"><label class="field__label" for="history-max-price">Đến (VND)</label><input class="input" id="history-max-price" name="max_price" type="number" min="0" inputmode="numeric"></div>
    <div class="field"><label class="field__label" for="history-sort">Sắp xếp</label><select class="select" id="history-sort" name="sort"><option value="newest">Mới nhất</option><option value="oldest">Cũ nhất</option><option value="price_desc">Giá cao nhất</option><option value="price_asc">Giá thấp nhất</option></select></div>
    <button class="btn btn--primary" type="submit">Áp dụng</button>
  </form>
  <div id="history-list" class="stack" aria-live="polite"></div>
  <nav class="history-pagination" id="history-pagination" aria-label="Phân trang lịch sử" hidden>
    <button class="btn" id="history-previous" type="button">Trang trước</button>
    <span id="history-page-status" aria-live="polite"></span>
    <button class="btn" id="history-next" type="button">Trang sau</button>
  </nav>
  <div class="compare-bar" id="compare-bar" hidden>
    <p id="compare-status" aria-live="polite"></p>
    <div class="row__actions">
      <button class="btn" id="compare-clear" type="button">Bỏ chọn</button>
      <a class="btn btn--primary" id="compare-go" href="compare.html">So sánh</a>
    </div>
  </div>
</main>
<site-footer></site-footer>
<template id="tpl-empty-state">
  <div class="empty"><p class="empty__title"></p><p class="empty__hint"></p><a class="btn empty__action"></a></div>
</template>
<dialog id="confirm-dialog">
  <h2 class="dialog__title"></h2>
  <p class="dialog__message"></p>
  <div class="dialog__actions">
    <button class="btn" data-cancel>Hủy</button>
    <button class="btn btn--danger" data-confirm>Xóa</button>
  </div>
</dialog>
<script type="module" src="js/components/site-header.js"></script>
<script type="module" src="js/components/site-footer.js"></script>
<script type="module" src="js/pages/predictions.js"></script>
</body>
</html>
