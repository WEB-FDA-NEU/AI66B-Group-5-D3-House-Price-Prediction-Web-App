<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt lại mật khẩu - HomeVal</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/design.css">
<link rel="stylesheet" href="css/experience.css">
<link rel="stylesheet" href="css/ux.css">
<link rel="stylesheet" href="css/luxe.css">
</head>
<body class="auth-page">
<main class="auth-shell" id="main-content">
  <aside class="auth-story"><a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">⌂</span>Home<span class="logo-accent">Val</span></a><div><p class="eyebrow">BẢO MẬT TÀI KHOẢN</p><h2>Tạo mật khẩu mới.</h2><p>Mã đặt lại chỉ dùng một lần và tự hết hạn sau 15 phút.</p></div><p>HomeVal · Hiểu giá trị, vững quyết định.</p></aside>
  <div class="auth-content">
    <a class="auth-back" href="login.html">← Về đăng nhập</a>
    <h1>Đặt lại mật khẩu</h1>
    <form id="reset-password-form" class="stack" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required autocomplete="email">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="code">Mã đặt lại gồm 6 chữ số</label>
        <input class="input" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="new_password">Mật khẩu mới</label>
        <input class="input" id="new_password" name="new_password" type="password" minlength="8" required autocomplete="new-password">
        <p class="field__error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="confirm_password">Nhập lại mật khẩu</label>
        <input class="input" id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
        <p class="field__error"></p>
      </div>
      <button class="btn btn--primary" type="submit">Đặt lại mật khẩu</button>
    </form>
    <div id="reset-password-message" role="status" hidden></div>
  </div>
</main>
<script type="module" src="js/pages/reset-password.js"></script>
</body>
</html>
