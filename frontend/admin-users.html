<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý người dùng - HomeVal</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/design.css">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/experience.css">
<link rel="stylesheet" href="css/models.css"><link rel="stylesheet" href="css/ux.css"></head>
<body>
<site-header active="admin"></site-header>
<main class="container page stack">
  <nav class="admin-nav" aria-label="Admin">
    <a class="btn" href="admin.html">Tổng quan</a>
    <a class="btn" href="admin-models.html">Mô hình</a>
    <a class="btn" href="admin-models-new.html">Huấn luyện</a>
    <a class="btn is-active" href="admin-users.html">Người dùng</a>
    <a class="btn" href="admin-datasets.html">Dữ liệu</a>
    <a class="btn" href="admin-reports.html">Báo cáo</a>
  </nav>
  <h1>Quản lý người dùng</h1>
  <p class="field__hint">Tìm kiếm tài khoản, xem vai trò, trạng thái và số dự đoán đã lưu. Vô hiệu hoá chặn đăng nhập ngay lập tức.</p>
  <form id="search-form" class="stack" role="search">
    <div class="field">
      <label class="field__label" for="q">Tìm theo tên hoặc email</label>
      <div class="save-prediction__controls">
        <input class="input" id="q" name="q" maxlength="80" placeholder="Ví dụ: anh@example.com">
        <button class="btn btn--primary" type="submit">Tìm kiếm</button>
      </div>
    </div>
    <div class="prediction-form__grid">
      <div class="field">
        <label class="field__label" for="role">Vai trò</label>
        <select class="select" id="role" name="role">
          <option value="">Tất cả</option>
          <option value="user">Người dùng</option>
          <option value="admin">Quản trị</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="status">Trạng thái</label>
        <select class="select" id="status" name="status">
          <option value="">Tất cả</option>
          <option value="Active">Đang hoạt động</option>
          <option value="Inactive">Đã vô hiệu hoá</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="sort">Sắp xếp</label>
        <select class="select" id="sort" name="sort">
          <option value="newest">Mới nhất</option>
          <option value="oldest">Cũ nhất</option>
          <option value="name">Tên A–Z</option>
          <option value="predictions">Nhiều dự đoán nhất</option>
        </select>
      </div>
    </div>
  </form>
  <div id="alert"></div>
  <div id="list"></div>
  <div id="pager" class="row__actions" hidden>
    <button class="btn" id="prev" type="button">← Trang trước</button>
    <p class="field__hint" id="page-info"></p>
    <button class="btn" id="next" type="button">Trang sau →</button>
  </div>
  <dialog id="confirm-dialog">
    <h3 class="dialog__title"></h3>
    <p class="dialog__message"></p>
    <div class="dialog__actions">
      <button class="btn" data-cancel>Hủy</button>
      <button class="btn btn--primary" data-confirm>Xác nhận</button>
    </div>
  </dialog>
</main>
<site-footer></site-footer>
<template id="tpl-empty-state">
  <div class="empty"><p class="empty__title"></p><p class="empty__hint"></p><a class="btn empty__action"></a></div>
</template>
<script type="module" src="js/components/site-header.js"></script>
<script type="module" src="js/components/site-footer.js"></script>
<script type="module" src="js/pages/admin-users.js"></script>
</body>
</html>
